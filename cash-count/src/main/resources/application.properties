# Web Server Port
server.port=8080

# H2 Database Configuration (File-based Persistent Storage)
spring.datasource.url=jdbc:h2:file:./data/cashcountdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console (set to false for production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf Settings (Disables caching so you can see HTML changes instantly upon refresh)
spring.thymeleaf.cache=false

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never

